name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
      NEXT_PUBLIC_CUSTOM_DOMAIN: ${{ vars.NEXT_PUBLIC_CUSTOM_DOMAIN }}
      NEXT_PUBLIC_THEME_PRESET: ${{ vars.NEXT_PUBLIC_THEME_PRESET }}
      NEXT_PUBLIC_ADSTERRA_NATIVE_SCRIPT_URL: ${{ secrets.NEXT_PUBLIC_ADSTERRA_NATIVE_SCRIPT_URL }}
      NEXT_PUBLIC_ADSTERRA_NATIVE_CONTAINER_ID: ${{ secrets.NEXT_PUBLIC_ADSTERRA_NATIVE_CONTAINER_ID }}
      BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check repository rules
        run: node scripts/repo-rules.mjs ci "$BEFORE" "$GITHUB_SHA"
        env:
          BEFORE: ${{ github.event.before }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public site after deployment
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, re, time, urllib.request
          base = os.environ["SITE_URL"].rstrip("/") + "/"
          assert base == "https://ride-a-dino.github.io/", f"Unexpected domain: {base}"
          def fetch(path, expected_text):
              url = base + path.lstrip("/")
              last_error = None
              for attempt in range(12):
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent": "RideADinoSiteHealthCheck/1.0"})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          status, content = response.status, response.read().decode("utf-8")
                      if status != 200 or expected_text not in content:
                          raise AssertionError(f"{url}: status={status}; expected content missing")
                      return content
                  except Exception as error:
                      last_error = error
                      if attempt < 11:
                          time.sleep(5)
              raise RuntimeError(f"Public verification failed for {url}: {last_error}")
          pages = {
              "": "Ride a Dino Wiki and Beginner Guide",
              "grip-training/": "Ride a Dino Grip Training Guide",
              "ranch/": "Ride a Dino Ranch and Pen Upgrade Guide"
          }
          footers = []
          for path, heading in pages.items():
              html = fetch(path, heading)
              footer = re.search(r"<footer\\b[^>]*>[\\s\\S]*?</footer>", html, flags=re.I)
              assert footer, f"Footer missing: {path or '/'}"
              assert html.lower().count("<footer") == 1, f"Duplicate Footer: {path or '/'}"
              assert "global-footer" in footer.group(0), f"Wrong Footer template: {path or '/'}"
              footers.append(footer.group(0))
              expected_url = base + path
              assert f'href="{expected_url}"' in html, f"Canonical not found in {path or '/'}"
              assert len(re.findall(r'<h1\b', html, flags=re.I)) == 1, f"Expected one H1 in {path or '/'}"
              assert "G-FKWD73D38M" in html, f"GA4 missing from {path or '/'}"
              assert "grip-training/" in html and "ranch/" in html, f"Internal navigation missing from {path or '/'}"
              assert not any(term in html for term in ("Yorich", "Codex", "ChatGPT", "Gator Dragon Games")), f"Unexpected template text in {path or '/'}"
              print(f"Verified HTTP 200, H1, canonical, GA4 and navigation: {expected_url}")
          assert len(set(footers)) == 1, "Footer contents differ between home and inner pages"
          print("Verified identical global footer on all 3 READY pages")
          robots = fetch("robots.txt", "Allow: /")
          assert "Sitemap: https://ride-a-dino.github.io/sitemap.xml" in robots
          sitemap = fetch("sitemap.xml", "<urlset")
          assert all(base + path in sitemap for path in pages), "Ready URLs missing from sitemap"
          assert "/dinosaurs/" not in sitemap and "/how-to-tame-dinos/" not in sitemap, "Non-READY pages should not be indexed"
          print("Verified public robots.txt and sitemap.xml")
          PY
